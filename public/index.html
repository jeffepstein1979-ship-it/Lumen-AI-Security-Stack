
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMEN AI | Sovereign Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #05020a;
            --imperial-purple: #2a0a4d;
            --deep-purple: #1a0533;
            --gold-bright: #f9d976;
            --gold-muted: #c5a059;
            --gold-dark: #8a6d3b;
            --text-light: #e0e0e0;
            --text-dim: #8a94a6;
        }

        body {
            background: radial-gradient(circle at center, var(--deep-purple) 0%, var(--obsidian) 100%);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow-x: hidden;
        }

        .logo-container {
            margin-bottom: 2rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-prism {
            width: 80px;
            height: 80px;
            border: 3px solid var(--gold-muted);
            transform: rotate(45deg);
            position: relative;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
            transition: 0.5s ease;
        }

        .logo-prism::after {
            content: 'L';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-family: 'Cinzel', serif;
            font-size: 40px;
            color: var(--gold-bright);
            font-weight: bold;
        }

        .logo-container:hover .logo-prism {
            transform: rotate(45deg) scale(1.1);
            border-color: var(--gold-bright);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.6);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: var(--gold-bright);
            letter-spacing: 0.8rem;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 15px rgba(249, 217, 118, 0.4);
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.4rem;
            color: var(--text-dim);
            margin-top: 1rem;
            margin-bottom: 4rem;
            letter-spacing: 0.1rem;
        }

        .vault-container {
            background: rgba(26, 5, 51, 0.6);
            padding: 3rem;
            border: 1px solid var(--gold-dark);
            border-radius: 2px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            max-width: 500px;
            width: 90%;
            transition: 0.4s ease;
        }

        .vault-container:hover {
            border-color: var(--gold-muted);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 8px;
        }

        label {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: var(--gold-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--gold-dark);
            color: #fff;
            padding: 12px 0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: 0.3s ease;
            outline: none;
        }

        input:focus {
            border-bottom: 1px solid var(--gold-bright);
        }

        button {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-bright) 100%);
            color: var(--obsidian);
            border: none;
            padding: 15px 30px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s ease;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.4);
            filter: brightness(1.1);
        }

        #result {
            margin-top: 2.5rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #fff;
            min-height: 60px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .status-tag {
            display: block;
            font-family: 'Cinzel', serif;
            color: var(--gold-bright);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-prism"></div>
    </div>

    <h1>Lumen AI</h1>
    <p class="tagline">"Discretion is the ultimate security."</p>

    <div class="vault-container">
        <div class="input-group">
            <div class="field">
                <label>Identity</label>
                <input type="email" id="email" placeholder="Enter your encrypted email">
            </div>
            <div class="field">
                <label>Target Perimeter</label>
                <input type="text" id="domain" placeholder="example.com">
            </div>
            <button onclick="getTeaser()">Initiate Audit</button>
        </div>
        <div id="result"></div>
    </div>

    <div class="footer">
        &copy; 2026 LUMEN AI | SOVEREIGN INTELLIGENCE
    </div>

    <script>
        async function getTeaser() {
            const email = document.getElementById('email').value;
            const domain = document.getElementById('domain').value;
            const resultDiv = document.getElementById('result');
            
            if(!email || !domain) {
                resultDiv.style.opacity = "1";
                resultDiv.innerHTML = "<span style='color:#ff4d4d'>Identity and Target required.</span>";
                return;
            }

            resultDiv.style.opacity = "0";
            resultDiv.innerText = "Consulting the vault...";
            resultDiv.style.opacity = "1";
            
            try {
                const response = await fetch(`/teaser`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, domain })
                });
                const data = await response.json();
                
                resultDiv.style.opacity = "0";
                setTimeout(() => {
                    resultDiv.innerHTML = `<span class="status-tag">${data.status}</span>${data.finding}`;
                    resultDiv.style.opacity = "1";
                }, 500);
            } catch (e) {
                resultDiv.style.opacity = "1";
                resultDiv.innerText = "The vault is currently sealed. Try again shortly.";
            }
        }
    </script>
</body>
</html>
